; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32_s3

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps = 
	https://github.com/me-no-dev/ESPAsyncWebServer.git
	ayushsharma82/AsyncElegantOTA @ ^2.2.5
	waspinator/CD74HC4067@^1.0.2
monitor_flags = 
	--filter
	debug
	--filter
	send_on_enter
	--echo
	--eol
	LF

[env:esp32_s3]
platform_packages = toolchain-riscv32-esp @ 8.4.0+2021r2-patch5
platform = espressif32
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.memory_type = opi_opi
board_build.f_cpu = 240000000L
board_build.partitions = huge_app_s3.csv 
board_build.flash_mode = dout
build_flags = -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_upload.maximum_ram_size= 8388608
board_upload.maximum_size = 16777216
lib_deps = 
	https://github.com/me-no-dev/ESPAsyncWebServer.git
	ayushsharma82/ElegantOTA
	waspinator/CD74HC4067@^1.0.2
monitor_flags = 
	--filter
	debug
	--filter
	send_on_enter
	--echo
	--eol
	LF



[env:esp32_s3_test]
board = esp32-s3-devkitc-2
framework = arduino
monitor_speed = 115200
upload_speed = 1000000
board_build.flash_mode = dout  ; <-------------------this is important line
;platform = https://github.com/platformio/platform-espressif32.git#v5.1.0
platform = https://github.com/platformio/platform-espressif32.git#v5.4.0
build_flags = -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
board_build.partitions = huge_app_s3.csv 
lib_deps = 
	https://github.com/me-no-dev/ESPAsyncWebServer.git
	ayushsharma82/ElegantOTA
	waspinator/CD74HC4067@^1.0.2
monitor_flags = 
	--filter
	debug
	--filter
	send_on_enter
	--echo
	--eol
	LF
